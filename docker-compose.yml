services:

  postgres:
    image: postgres:16-alpine
    container_name: memograph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memograph
      POSTGRES_USER: memograph
      POSTGRES_PASSWORD: memograph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memograph-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: memograph-memgraph
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"

  redis:
    image: redis:7-alpine
    container_name: memograph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data: